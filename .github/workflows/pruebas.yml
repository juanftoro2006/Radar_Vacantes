name: Pruebas

# Cada push que toque codigo o configuracion corre las pruebas.
# Los commits del bot (solo data/) no disparan esto.
on:
  push:
    paths-ignore:
      - "data/**"
      - "**.md"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Corrida completa sin red
        run: python -m radar --seco --no-guardar --fixtures tests/fixtures
