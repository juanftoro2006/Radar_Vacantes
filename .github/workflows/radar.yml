name: Radar de vacantes

on:
  schedule:
    # Cron de GitHub va en UTC. Bogota = UTC-5.
    # 11:17 UTC = 06:17 | 14:17 = 09:17 | 17:17 = 12:17 | 20:17 = 15:17 | 23:17 = 18:17 (hora Bogota)
    #
    # GitHub no garantiza el cron: con carga alta lo retrasa y a veces lo DESCARTA.
    # El 21-sep la corrida de las 00:17 UTC nunca ocurrio. Por eso:
    #   - minuto 17, no 00: a la hora en punto se encolan miles de crons
    #   - nada cerca de las 00:00 UTC: es la hora mas congestionada del dia
    #   - 5 turnos en vez de 4: si se pierde uno, el siguiente recupera todo
    #     (el dedup y la ventana de 7 dias hacen que un turno perdido solo retrase)
    - cron: "17 11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      seco:
        description: "Modo seco: no envia nada a Telegram"
        type: boolean
        default: false
      resumen:
        description: "Forzar el resumen diario"
        type: boolean
        default: false

permissions:
  contents: write   # commitear data/
  pages: write      # publicar el dashboard
  id-token: write   # lo exige deploy-pages para verificar el origen

# Nunca dos corridas a la vez: las dos escribirian data/vacantes.csv.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python -m radar
          ${{ inputs.seco && '--seco' || '' }}
          ${{ inputs.resumen && '--resumen' || '' }}

      # always(): aunque Telegram falle, el registro se guarda. Lo no avisado
      # queda con 'notificada' vacia y la siguiente corrida lo reintenta.
      - name: Guardar registro
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
            exit 0
          fi
          git commit -m "datos: corrida $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      # El dashboard se genera del registro guardado, no se versiona: es un derivado.
      - name: Generar dashboard
        if: ${{ !cancelled() }}
        run: python -m radar.dashboard --salida site

      - name: Subir dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pagina:
    needs: radar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v5
